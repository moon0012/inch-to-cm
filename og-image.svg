<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="100" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Ruler Icon -->
  <text x="600" y="180" font-size="100" text-anchor="middle">📏</text>
  
  <!-- Title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Inch to CM</text>
  
  <!-- Subtitle -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)" text-anchor="middle">Free Online Length Converter</text>
  
  <!-- Conversion Examples -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">1 inch = 2.54 cm | 1 cm = 0.39 inch</text>
  
  <!-- CTA Button -->
  <rect x="450" y="490" width="300" height="60" rx="30" fill="#10B981"/>
  <text x="600" y="532" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Convert Now!</text>
  
  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="middle">inch-to-cm.online</text>
</svg>
